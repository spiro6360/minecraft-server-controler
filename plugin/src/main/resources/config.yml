# ============================================
#  WebPanel 설정
# ============================================

# WebSocket 서버가 열릴 주소와 포트
# 127.0.0.1 = 이 컴퓨터 안에서만 접속 가능 (Cloudflare Tunnel 을 쓸 때 권장, 가장 안전)
# 0.0.0.0   = 외부에서도 직접 접속 가능 (권장하지 않음)
host: 127.0.0.1
port: 8765

# 웹사이트 로그인용 비밀 토큰.
# 비워 두면 서버가 처음 켜질 때 무작위로 만들어서 여기에 저장하고 콘솔에 한 번 출력한다.
# 유출되면 지우고 서버를 재시작하면 새 토큰이 만들어진다.
token: ''

# 접속을 허용할 웹사이트 주소 목록 (브라우저가 보내는 Origin 헤더로 검사)
# 예: - https://my-panel.pages.dev
# '*' 가 있으면 모든 사이트 허용 (토큰은 여전히 필요)
allowed-origins:
  - '*'

# 로그인 실패 제한: 같은 IP 에서 max-failures 번 틀리면 block-minutes 분 동안 차단
auth:
  max-failures: 5
  block-minutes: 15

# 실시간 동기화 주기 (틱 단위, 20틱 = 1초)
sync:
  inventory-interval-ticks: 5
  status-interval-ticks: 40

# 웹 콘솔에 보관할 최근 로그 줄 수
console-buffer-lines: 500
